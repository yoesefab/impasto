name: check

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and zsh
        run: sudo apt-get update && sudo apt-get install -y lua5.4 zsh

      - name: Verify Python, Lua, zsh, bash, JSON and TOML syntax
        run: ./setup check

      - name: Distro install plans
        run: tests/distro.sh

      - name: Every required apt name resolves
        run: tests/apt_manifest.sh

      - name: Package parser and wallpaper wrapper
        run: python3 tests/test_apt_parse.py
